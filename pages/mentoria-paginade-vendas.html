<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentoria de Tráfego Pago - Vendas Paginação</title>
    <style>
        body
</head>
<body>
    <h1>Mentoria de Tráfego Pago - Vendas</h1>
    <div id="product-list"></div>
    <div class="pagination" id="pagination-controls"></div>

    <script>
        const products = Array.from({length: 45}, (_, i) => ({id: i+1, title: `Mentoria ${i+1}`, price: (i+1)*10}));
        const pageSize = 10;
        let currentPage = 1;

        function renderPage(page) {
            const start = (page-1)*pageSize;
            const end = start + pageSize;
            const pageItems = products.slice(start, end);
            const list = document.getElementById('product-list');
            list.innerHTML = '';
            pageItems.forEach(p => {
                const div = document.createElement('div');
                div.className = 'product';
                div.innerHTML = `<h3>${p.title}</h3><p>Preço: R$ ${p.price}</p>`;
                list.appendChild(div);
            });
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('pagination-controls');
            controls.innerHTML = '';
            const totalPages = Math.ceil(products.length / pageSize);
            for (let i=1; i<=totalPages; i++) {
                const btn = document.createElement('button');
                btn.textContent = i;
                btn.disabled = i === currentPage;
                btn.onclick = () => { currentPage = i; renderPage(i); };
                controls.appendChild(btn);
            }
        }

        renderPage(currentPage);
    </script>
</body>
</html>
